# Configuration for binary and model downloads
# Update these versions and URLs to get newer releases

# ============================================================================
# LLAMA.CPP CONFIGURATION
# ============================================================================
# Latest releases: https://github.com/ggerganov/llama.cpp/releases
LLAMA_VERSION="b3835"
LLAMA_BUILD_METHOD="download"  # Options: "download" or "source"
LLAMA_GIT_REPO="https://github.com/ggerganov/llama.cpp.git"
LLAMA_GIT_TAG="b3835"

# Binary download URLs (used when LLAMA_BUILD_METHOD="download")
LLAMA_MACOS_URL="https://github.com/ggerganov/llama.cpp/releases/download/b3835/llama-b3835-bin-macos-arm64.zip"
LLAMA_MACOS_X86_URL="https://github.com/ggerganov/llama.cpp/releases/download/b3835/llama-b3835-bin-macos-x86_64.zip"
LLAMA_LINUX_X64_URL="https://github.com/ggerganov/llama.cpp/releases/download/b3835/llama-b3835-bin-linux-x86_64.zip"
LLAMA_LINUX_ARM64_URL="https://github.com/ggerganov/llama.cpp/releases/download/b3835/llama-b3835-bin-linux-arm64.zip"
LLAMA_WINDOWS_URL="https://github.com/ggerganov/llama.cpp/releases/download/b3835/llama-b3835-bin-win-x64.zip"

# ============================================================================
# WHISPER.CPP CONFIGURATION
# ============================================================================
# Latest releases: https://github.com/ggerganov/whisper.cpp/releases
WHISPER_VERSION="v1.6.2"
WHISPER_BUILD_METHOD="source"  # macOS builds from source; other platforms download
WHISPER_GIT_REPO="https://github.com/ggerganov/whisper.cpp.git"
WHISPER_GIT_TAG="v1.6.2"

# CMake configuration for source builds
WHISPER_CMAKE_FLAGS="-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF"

# Binary download URLs (used for Linux/Windows)
WHISPER_LINUX_X64_URL="https://github.com/ggerganov/whisper.cpp/releases/download/v1.6.2/whisper-linux-x86_64.zip"
WHISPER_LINUX_ARM64_URL="https://github.com/ggerganov/whisper.cpp/releases/download/v1.6.2/whisper-linux-arm64.zip"
WHISPER_WINDOWS_URL="https://github.com/ggerganov/whisper.cpp/releases/download/v1.6.2/whisper-win64.zip"

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================
# Whisper model - available from Hugging Face
WHISPER_MODEL_NAME="ggml-base.en.bin"
WHISPER_MODEL_URL="https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"

# Llama model - specify your preferred model source
# Examples:
# - Hugging Face: https://huggingface.co/models
# - Ollama: https://ollama.ai/library
# - Meta's official releases
LLAMA_MODEL_NAME="gemma3-4b-it"
LLAMA_MODEL_URL="https://huggingface.co/unsloth/gemma-3-4b-it-GGUF/resolve/main/gemma-3-4b-it-IQ4_NL.gguf"

# ============================================================================
# BUILD DEPENDENCIES
# ============================================================================
# For macOS source builds, ensure these are installed:
# - Xcode Command Line Tools: xcode-select --install
# - CMake: brew install cmake
# - Git: usually comes with Xcode CLT
